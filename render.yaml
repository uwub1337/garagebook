services:
  - type: web
    name: garagebook
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_NAME
        value: GarageBook
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: DB_CONNECTION
        value: sqlite
      - key: PREVIEW_MODE
        value: "true"
      - key: VITE_PREVIEW_MODE
        value: "true"
